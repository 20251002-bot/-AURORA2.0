  <title>極光音響 | 產品介紹</title>
  <link rel="stylesheet" href="style.css">

<body>
  <!-- 導覽列 -->
  <nav class="navbar">
    <div class="logo">AURORA 極光</div>
    <ul class="nav-links">
      <li><a href="index.html">首頁</a></li>
      <li><a href="products.html" class="active">產品介紹</a></li>
      <li><a href="contact.html">聯絡我們</a></li>
    </ul>
  </nav>

  <main class="products-main">
    <h1 class="page-title">產品介紹</h1>
    <p class="page-subtitle">探索極光系列，找到屬於你的聲音伴侶。</p>

    <!-- 產品卡片網格 -->
    <div class="product-grid">
      <div class="product-card">
        <img src="https://picsum.photos/id/1015/400/300?grayscale" alt="極光 Pro">
        <h2>極光 Pro</h2>
        <p class="price">NT$ 8,990</p>
        <p>旗艦級音質，搭載雙單體與空間音訊。</p>
        <button class="btn-secondary offer-trigger">查看優惠</button>
      </div>
      <div class="product-card">
        <img src="https://picsum.photos/id/1040/400/300?grayscale" alt="極光 Air">
        <h2>極光 Air</h2>
        <p class="price">NT$ 5,490</p>
        <p>輕巧舒適，適合日常通勤與運動。</p>
        <button class="btn-secondary offer-trigger">查看優惠</button>
      </div>
      <div class="product-card">
        <img src="https://picsum.photos/id/1067/400/300?grayscale" alt="極光 Studio">
        <h2>極光 Studio</h2>
        <p class="price">NT$ 12,800</p>
        <p>專業監聽級耳機，錄音室必備。</p>
        <button class="btn-secondary offer-trigger">查看優惠</button>
      </div>
